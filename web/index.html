<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft Box | لیگ درفت فوتبال</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-ball">⚽</span>
      <span>Draft Box</span>
    </div>
    <nav class="topbar-actions">
      <span id="whoami" class="whoami hidden"></span>
      <button id="btnSettings" class="btn btn-ghost btn-sm" title="تنظیمات آدرس سرور">⚙️</button>
      <button id="btnLogout" class="btn btn-ghost btn-sm hidden">خروج</button>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <div id="toast" class="toast hidden"></div>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-form">
      <h3>آدرس سرور بازی (Backend URL)</h3>
      <p class="muted">فرانت روی GitHub Pages استاتیک است؛ باید آدرس بک‌اند Docker/Node را اینجا وارد کنید.</p>
      <input id="apiBaseInput" type="text" placeholder="https://your-backend.example.com" />
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">انصراف</button>
        <button value="save" id="btnSaveSettings" class="btn btn-primary">ذخیره</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/formations.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/lobby.js"></script>
  <script src="js/views/draft.js"></script>
  <script src="js/views/tournament.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
