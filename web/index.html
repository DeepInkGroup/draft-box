<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft Box | Football Draft League</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>Draft Box</span>
    </div>
    <nav class="topbar-actions">
      <button id="btnHome" class="btn btn-ghost btn-sm icon-btn hidden" title="Back to home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      </button>
      <button id="btnProfile" class="btn btn-ghost btn-sm icon-btn hidden" title="Profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button id="btnSettings" class="btn btn-ghost btn-sm icon-btn" title="Server address settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <span>V 1.1.4</span>
    <span class="footer-center">Draft Box</span>
    <a class="footer-github" href="https://github.com/DeepInkGroup" target="_blank" rel="noopener noreferrer" title="GitHub">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-form">
      <h3>Game Server Address (Backend URL)</h3>
      <p class="muted">This frontend is static (GitHub Pages); enter the URL of your deployed Docker/Node backend here.</p>
      <input id="apiBaseInput" type="text" placeholder="https://your-backend.example.com" />
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">Cancel</button>
        <button value="save" id="btnSaveSettings" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="profileDialog" class="dialog">
    <div class="dialog-form">
      <h3>Profile</h3>
      <div class="field">
        <label>Username</label>
        <input id="profileUsername" type="text" disabled />
      </div>
      <div class="field">
        <label>Email</label>
        <input id="profileEmail" type="text" disabled />
      </div>
      <hr style="border-color: var(--border); margin: 16px 0;" />
      <h3>Change Password</h3>
      <div class="field">
        <label>Current Password</label>
        <input id="profileCurrentPassword" type="password" />
      </div>
      <div class="field">
        <label>New Password</label>
        <input id="profileNewPassword" type="password" placeholder="at least 6 characters" />
      </div>
      <button id="btnChangePassword" class="btn btn-primary btn-block">Update Password</button>
      <div class="error-text hidden" id="profileError"></div>
      <div class="dialog-actions" style="justify-content: space-between; margin-top: 18px;">
        <button id="btnLogout" class="btn btn-ghost" style="color: var(--danger);">Log out</button>
        <button id="btnCloseProfile" class="btn btn-ghost">Close</button>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/formations.js"></script>
  <script src="js/components/pitch.js"></script>
  <script src="js/components/formationPicker.js"></script>
  <script src="js/components/toggleGroup.js"></script>
  <script src="js/components/ratingsCard.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/lobby.js"></script>
  <script src="js/views/draft.js"></script>
  <script src="js/views/tournament.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
