name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure the game server address
        env:
          DRAFTBOX_API_BASE: ${{ vars.DRAFTBOX_API_BASE }}
        run: node scripts/write-pages-config.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the hosted game connection
        if: ${{ vars.DRAFTBOX_API_BASE != '' }}
        env:
          DRAFTBOX_API_BASE: ${{ vars.DRAFTBOX_API_BASE }}
          DRAFTBOX_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-hosted.cjs
