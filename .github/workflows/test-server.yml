name: Test server and deployment

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm test
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the full application image
        run: docker build -f server/Dockerfile -t draft-box:test .
      - name: Check the container serves the game and API
        run: |
          docker run -d --name draft-box -p 4321:4321 -e JWT_SECRET=ci-test-secret draft-box:test
          trap 'docker logs draft-box; docker rm -f draft-box' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4321/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4321/api/health | grep -q '"ok":true'
          curl -fsS http://localhost:4321/ | grep -q 'Draft Box'
          curl -fsS http://localhost:4321/js/config.js | grep -q 'DEFAULT_API_BASE'
